<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Leave Request Portal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f8fafc;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px 24px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 16px;
            opacity: 0.9;
        }

        .form-content {
            padding: 32px 24px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-label {
            display: block;
            font-size: 16px;
            font-weight: 500;
            color: #374151;
            margin-bottom: 12px;
        }

        .form-input {
            width: 100%;
            padding: 16px 20px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-size: 16px;
            color: #1f2937;
            background: white;
            transition: border-color 0.3s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .form-textarea {
            min-height: 120px;
            resize: vertical;
            font-family: inherit;
        }

        .leave-type-options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .leave-option {
            display: flex;
            align-items: center;
            padding: 16px 20px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: white;
        }

        .leave-option:hover {
            border-color: #d1d5db;
            background: #f9fafb;
        }

        .leave-option.selected {
            border-color: #10b981;
            background: #10b981;
            color: white;
        }

        .leave-icon {
            font-size: 24px;
            margin-right: 16px;
        }

        .leave-text {
            font-size: 16px;
            font-weight: 500;
        }

        .duration-options {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .duration-option {
            flex: 1;
            min-width: 120px;
            padding: 16px 20px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: white;
            font-size: 16px;
            font-weight: 500;
            color: #374151;
        }

        .duration-option:hover {
            border-color: #d1d5db;
            background: #f9fafb;
        }

        .duration-option.selected {
            border-color: #6366f1;
            background: #6366f1;
            color: white;
        }

        .submit-button {
            width: 100%;
            background: linear-gradient(135deg, #f59e0b 0%, #f97316 100%);
            color: white;
            border: none;
            padding: 18px 24px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 8px;
        }

        .submit-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(245, 158, 11, 0.3);
        }

        .submit-button:active {
            transform: translateY(0);
        }

        .submit-button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .success-message {
            background: #d1fae5;
            border: 1px solid #a7f3d0;
            color: #065f46;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 24px;
            display: none;
            text-align: center;
        }

        .error-message {
            background: #fee2e2;
            border: 1px solid #fecaca;
            color: #991b1b;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 24px;
            display: none;
            text-align: center;
        }

        #end-date-group {
            display: none;
        }

        @media (max-width: 640px) {
            .container {
                margin: 0;
                border-radius: 0;
                min-height: 100vh;
            }

            .duration-options {
                flex-direction: column;
            }

            .duration-option {
                min-width: auto;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📄 Apply for Leave</h1>
            <p>Submit your leave request</p>
        </div>

        <div class="form-content">
            <div id="success-message" class="success-message">
                ✅ Your leave request has been submitted successfully and sent to admin for approval!
            </div>

            <div id="error-message" class="error-message">
                ❌ There was an error submitting your request. Please try again.
            </div>

            <form name="leave-request" method="POST" data-netlify="true" data-netlify-recaptcha="true" id="leaveForm">
                <input type="hidden" name="form-name" value="leave-request" />
                
                <!-- Employee Information -->
                <div class="form-group">
                    <label class="form-label">Employee Name</label>
                    <input type="text" name="employee-name" class="form-input" placeholder="Enter your full name" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Employee ID</label>
                    <input type="text" name="employee-id" class="form-input" placeholder="Enter your employee ID" required>
                </div>

                <!-- Leave Type -->
                <div class="form-group">
                    <label class="form-label">Leave Type</label>
                    <div class="leave-type-options">
                        <div class="leave-option" onclick="selectLeaveType('Sick Leave', this)">
                            <span class="leave-icon">🤒</span>
                            <span class="leave-text">Sick Leave</span>
                        </div>
                        <div class="leave-option" onclick="selectLeaveType('Casual Leave', this)">
                            <span class="leave-icon">📋</span>
                            <span class="leave-text">Casual Leave</span>
                        </div>
                        <div class="leave-option" onclick="selectLeaveType('Earned Leave', this)">
                            <span class="leave-icon">🏆</span>
                            <span class="leave-text">Earned Leave</span>
                        </div>
                        <div class="leave-option" onclick="selectLeaveType('Other', this)">
                            <span class="leave-icon">✏️</span>
                            <span class="leave-text">Other</span>
                        </div>
                    </div>
                    <input type="hidden" name="leave-type" id="leave-type-hidden" required>
                </div>

                <!-- Duration -->
                <div class="form-group">
                    <label class="form-label">Duration</label>
                    <div class="duration-options">
                        <div class="duration-option" onclick="selectDuration('Half Day', this)">Half Day</div>
                        <div class="duration-option selected" onclick="selectDuration('Full Day', this)">Full Day</div>
                        <div class="duration-option" onclick="selectDuration('Multiple Days', this)">Multiple Days</div>
                    </div>
                    <input type="hidden" name="duration" id="duration-hidden" value="Full Day" required>
                </div>

                <!-- Date Fields -->
                <div class="form-group">
                    <label class="form-label">Start Date</label>
                    <input type="date" name="start-date" id="start-date" class="form-input" required>
                </div>

                <div class="form-group" id="end-date-group">
                    <label class="form-label">End Date</label>
                    <input type="date" name="end-date" id="end-date" class="form-input">
                </div>

                <!-- Reason -->
                <div class="form-group">
                    <label class="form-label">Reason</label>
                    <textarea name="reason" class="form-input form-textarea" placeholder="Write your reason here..." required></textarea>
                </div>

                <!-- Hidden Fields for Date/Time -->
                <input type="hidden" name="request-date" id="request-date">
                <input type="hidden" name="submission-time" id="submission-time">

                <!-- reCAPTCHA -->
                <div data-netlify-recaptcha="true" style="margin-bottom: 24px;"></div>

                <button type="submit" class="submit-button" id="submit-btn">
                    Apply for Leave →
                </button>
            </form>
        </div>
    </div>

    <script>
        // Global variables
        let selectedLeaveType = '';
        let selectedDuration = 'Full Day';

        // Initialize form
        document.addEventListener('DOMContentLoaded', function() {
            // Set current date and time
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('start-date').value = today;
            document.getElementById('start-date').min = today;
            document.getElementById('end-date').min = today;
            
            // Set hidden fields
            document.getElementById('request-date').value = new Date().toLocaleDateString('en-GB');
            document.getElementById('submission-time').value = new Date().toLocaleString();
        });

        // Leave type selection
        function selectLeaveType(leaveType, element) {
            // Remove selected class from all leave options
            document.querySelectorAll('.leave-option').forEach(opt => opt.classList.remove('selected'));
            
            // Add selected class to clicked option
            element.classList.add('selected');
            
            // Set global variable and hidden input
            selectedLeaveType = leaveType;
            document.getElementById('leave-type-hidden').value = leaveType;
            
            console.log('Selected leave type:', leaveType);
        }

        // Duration selection
        function selectDuration(duration, element) {
            // Remove selected class from all duration options
            document.querySelectorAll('.duration-option').forEach(opt => opt.classList.remove('selected'));
            
            // Add selected class to clicked option
            element.classList.add('selected');
            
            // Set global variable and hidden input
            selectedDuration = duration;
            document.getElementById('duration-hidden').value = duration;
            
            // Show/hide end date based on selection
            const endDateGroup = document.getElementById('end-date-group');
            const endDateInput = document.getElementById('end-date');
            
            if (duration === 'Multiple Days') {
                endDateGroup.style.display = 'block';
                endDateInput.required = true;
            } else {
                endDateGroup.style.display = 'none';
                endDateInput.required = false;
                endDateInput.value = '';
            }
            
            console.log('Selected duration:', duration);
        }

        // Update end date minimum when start date changes
        document.getElementById('start-date').addEventListener('change', function() {
            const endDateInput = document.getElementById('end-date');
            endDateInput.min = this.value;
            if (endDateInput.value && endDateInput.value < this.value) {
                endDateInput.value = this.value;
            }
        });

        // Form submission
        document.getElementById('leaveForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Validate leave type selection
            if (!selectedLeaveType) {
                alert('Please select a leave type');
                return;
            }
            
            // Update hidden fields with current values
            const currentDate = new Date().toLocaleDateString('en-GB');
            const currentTime = new Date().toLocaleString();
            
            document.getElementById('request-date').value = currentDate;
            document.getElementById('submission-time').value = currentTime;
            document.getElementById('leave-type-hidden').value = selectedLeaveType;
            document.getElementById('duration-hidden').value = selectedDuration;
            
            // Create form data
            const formData = new FormData();
            
            // Add all form fields
            formData.append('form-name', 'leave-request');
            formData.append('employee-name', document.querySelector('input[name="employee-name"]').value);
            formData.append('employee-id', document.querySelector('input[name="employee-id"]').value);
            formData.append('leave-type', selectedLeaveType);
            formData.append('duration', selectedDuration);
            formData.append('start-date', document.getElementById('start-date').value);
            formData.append('reason', document.querySelector('textarea[name="reason"]').value);
            formData.append('request-date', currentDate);
            formData.append('submission-time', currentTime);
            
            // Add end date only if Multiple Days is selected
            if (selectedDuration === 'Multiple Days') {
                const endDate = document.getElementById('end-date').value;
                if (endDate) {
                    formData.append('end-date', endDate);
                }
            }
            
            const submitBtn = document.getElementById('submit-btn');
            
            // Show loading state
            submitBtn.textContent = 'Submitting...';
            submitBtn.disabled = true;
            
            console.log('Submitting form with data:', {
                'employee-name': document.querySelector('input[name="employee-name"]').value,
                'employee-id': document.querySelector('input[name="employee-id"]').value,
                'leave-type': selectedLeaveType,
                'duration': selectedDuration,
                'start-date': document.getElementById('start-date').value,
                'reason': document.querySelector('textarea[name="reason"]').value,
                'request-date': currentDate,
                'submission-time': currentTime
            });
            
            // Submit form
            fetch('/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: new URLSearchParams(formData).toString()
            })
            .then(() => {
                // Show success message
                document.getElementById('success-message').style.display = 'block';
                document.getElementById('error-message').style.display = 'none';
                
                // Reset form
                this.reset();
                
                // Reset selections
                document.querySelectorAll('.leave-option').forEach(opt => opt.classList.remove('selected'));
                document.querySelectorAll('.duration-option').forEach(opt => opt.classList.remove('selected'));
                document.querySelectorAll('.duration-option')[1].classList.add('selected'); // Default to Full Day
                
                // Reset global variables
                selectedLeaveType = '';
                selectedDuration = 'Full Day';
                
                // Reset hidden inputs
                document.getElementById('leave-type-hidden').value = '';
                document.getElementById('duration-hidden').value = 'Full Day';
                
                // Reset dates
                const today = new Date().toISOString().split('T')[0];
                document.getElementById('start-date').value = today;
                document.getElementById('end-date-group').style.display = 'none';
                document.getElementById('end-date').required = false;
                
                // Reset hidden fields
                document.getElementById('request-date').value = new Date().toLocaleDateString('en-GB');
                document.getElementById('submission-time').value = new Date().toLocaleString();
                
                // Scroll to top
                window.scrollTo({ top: 0, behavior: 'smooth' });
            })
            .catch((error) => {
                console.error('Form submission error:', error);
                // Show error message
                document.getElementById('error-message').style.display = 'block';
                document.getElementById('success-message').style.display = 'none';
            })
            .finally(() => {
                // Reset button
                submitBtn.textContent = 'Apply for Leave →';
                submitBtn.disabled = false;
            });
        });
    </script>
</body>
</html>
