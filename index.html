<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Leave Request Form</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 40px;
            max-width: 600px;
            width: 100%;
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 36px;
            color: white;
            font-weight: bold;
        }

        .title {
            font-size: 28px;
            font-weight: bold;
            color: #2d3748;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #718096;
            font-size: 16px;
        }

        .form-section {
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 18px;
            font-weight: bold;
            color: #2d3748;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
        }

        .section-title::before {
            content: "📝";
            margin-right: 8px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #4a5568;
            margin-bottom: 8px;
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: #ffffff;
        }

        .form-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-input:read-only {
            background: #f7fafc;
            color: #4a5568;
        }

        .form-textarea {
            min-height: 100px;
            resize: vertical;
        }

        .submit-btn {
            width: 100%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 16px 24px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .success-message {
            background: #f0fff4;
            border: 1px solid #9ae6b4;
            color: #22543d;
            padding: 16px;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
            text-align: center;
        }

        .required {
            color: #e53e3e;
        }

        @media (max-width: 768px) {
            .container {
                padding: 30px 20px;
                margin: 10px;
            }

            .title {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <div class="logo">📝</div>
            <h1 class="title">Leave Request</h1>
            <p class="subtitle">Submit your leave application</p>
        </div>

        <form name="leave-request" method="POST" data-netlify="true" id="leaveForm">
            <div class="form-section">
                <div class="section-title">Employee Information</div>

                <div class="form-group">
                    <label class="form-label" for="employee-name">Employee Name <span class="required">*</span></label>
                    <input type="text" id="employee-name" name="employee-name" class="form-input" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="employee-id">Employee ID <span class="required">*</span></label>
                    <input type="text" id="employee-id" name="employee-id" class="form-input" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="leave-type">Leave Type <span class="required">*</span></label>
                    <select id="leave-type" name="leave-type" class="form-input" required>
                        <option value="">Select leave type</option>
                        <option value="Sick Leave">Sick Leave</option>
                        <option value="Casual Leave">Casual Leave</option>
                        <option value="Earned Leave">Earned Leave</option>
                        <option value="Emergency Leave">Emergency Leave</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label" for="duration">Duration <span class="required">*</span></label>
                    <select id="duration" name="duration" class="form-input" required>
                        <option value="">Select duration</option>
                        <option value="Full Day">Full Day</option>
                        <option value="Half Day">Half Day</option>
                        <option value="Multiple Days">Multiple Days</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label" for="start-date">Start Date <span class="required">*</span></label>
                    <input type="date" id="start-date" name="start-date" class="form-input" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="end-date">End Date</label>
                    <input type="date" id="end-date" name="end-date" class="form-input">
                </div>

                <div class="form-group">
                    <label class="form-label" for="reason">Reason for Leave <span class="required">*</span></label>
                    <textarea id="reason" name="reason" class="form-input form-textarea" 
                        placeholder="Please provide detailed reason for your leave" required></textarea>
                </div>

                <div class="form-group">
                    <label class="form-label" for="contact-number">Contact Number</label>
                    <input type="tel" id="contact-number" name="contact-number" class="form-input" 
                        placeholder="Contact number during leave">
                </div>

                <!-- Hidden fields -->
                <input type="hidden" name="request-date" id="request-date">
                <input type="hidden" name="submission-time" id="submission-time">
            </div>

            <button type="submit" class="submit-btn">
                📝 Submit Leave Request
            </button>
        </form>

        <div class="success-message" id="successMessage">
            ✅ Your leave request has been submitted successfully and sent to HR for approval!
        </div>
    </div>

    <script>
        // Set current date as default
        document.getElementById('request-date').value = new Date().toISOString().split('T')[0];
        document.getElementById('start-date').value = new Date().toISOString().split('T')[0];
        
        // Handle form submission
        document.getElementById('leaveForm').addEventListener('submit', function (e) {
            e.preventDefault();

            // Set submission time
            document.getElementById('submission-time').value = new Date().toLocaleString();

            const formData = new FormData(this);

            fetch('/', {
                method: 'POST',
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: new URLSearchParams(formData).toString()
            })
                .then(() => {
                    document.getElementById('successMessage').style.display = 'block';
                    document.getElementById('leaveForm').style.display = 'none';
                })
                .catch((error) => {
                    alert('Error submitting leave request. Please try again.');
                    console.error('Error:', error);
                });
        });

        // Handle duration change to show/hide end date
        document.getElementById('duration').addEventListener('change', function() {
            const endDateGroup = document.getElementById('end-date').parentElement;
            if (this.value === 'Multiple Days') {
                endDateGroup.style.display = 'block';
                document.getElementById('end-date').required = true;
            } else {
                endDateGroup.style.display = 'none';
                document.getElementById('end-date').required = false;
                document.getElementById('end-date').value = '';
            }
        });
    </script>
</body>

</html>
